<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cartel Pélicans</title>
<meta name="description" content="Cartel Pélicans — Bandcamp, SoundCloud, Instagram, contact.">
<meta property="og:title" content="Cartel Pélicans">
<meta property="og:description" content="Bandcamp, SoundCloud, Instagram, contact.">
<meta property="og:image" content="cover.jpg">
<meta property="og:type" content="music.band">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#EFC6C5">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#EFC6C5;
  --ink:#17090B;
  --muted:#8E3B41;
  --rule:#D49A9A;
  --accent:#B8202E;
  --shade:rgba(23,9,11,.055);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#190709; --ink:#F0D2D0; --muted:#BE7A7E;
    --rule:#48161C; --accent:#E4515E; --shade:rgba(255,255,255,.05);
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; justify-content:center;
  padding:clamp(28px,8vh,72px) 16px 44px;
}

.sheet{width:100%; max-width:440px}

/* ── entête ── */
.head{display:flex; flex-direction:column; align-items:center; text-align:center}

.avatar{
  width:clamp(70px,19vw,86px); height:auto; aspect-ratio:1/1;
  border-radius:50%; object-fit:cover; display:block;
  border:1px solid var(--rule);
}

h1{
  margin:16px 0 0; font-size:clamp(27px,7.5vw,34px); font-weight:600;
  font-stretch:108%; letter-spacing:-.02em; line-height:1.05;
}

/* ── liens ── */
.links{margin:26px 0 0; border-top:1px solid var(--rule)}
.row{
  display:flex; align-items:baseline; gap:14px;
  padding:17px 14px 17px 13px;
  border-bottom:1px solid var(--rule); border-left:2px solid transparent;
  color:inherit; text-decoration:none;
  transition:background .12s ease, border-color .12s ease, padding-left .12s ease;
}
.row:hover,.row:focus-visible{
  background:var(--shade); border-left-color:var(--accent);
  padding-left:19px; outline:none;
}
.row:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.label{flex:1 1 auto; font-weight:600; font-stretch:112%; letter-spacing:-.012em; font-size:17px}
.host{
  flex:0 0 auto; font-size:12.5px; font-weight:400; font-stretch:78%;
  color:var(--muted); letter-spacing:.015em;
}
.row:hover .host,.row:focus-visible .host{color:var(--accent)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

<body>
<main class="sheet">
  <header class="head">
    <picture>
      <source srcset="cover.webp" type="image/webp">
      <img class="avatar" src="cover.jpg" alt="" width="300" height="300">
    </picture>
    <h1>Cartel Pélicans</h1>
  </header>

  <nav class="links" id="links"></nav>
</main>

<script>
/* ═══════════════════════════════════════════════════════
   Les liens se modifient ici, et nulle part ailleurs.
   ═══════════════════════════════════════════════════════ */
const LINKS = [
  { label: "Bandcamp",   url: "https://cartelpelicans.bandcamp.com/album/cartel-p-licans" },
  { label: "SoundCloud", url: "https://soundcloud.com/cartel-pelicans/sets/cartel-pelicans" },
  { label: "Instagram",  url: "https://www.instagram.com/cartelpelicans.band" },
  { label: "Contact",    url: "mailto:cartelpelicansband@gmail.com" },
];
/* ═══════════════════════════════════════════════════════ */

const hostOf = (url) => url.startsWith("mailto:")
  ? url.slice(7)
  : new URL(url).hostname.replace(/^www\./, "");

document.getElementById("links").innerHTML = LINKS.map(l => `
  <a class="row" href="${l.url}"${l.url.startsWith("mailto:") ? "" : ' rel="me noopener"'}>
    <span class="label">${l.label}</span>
    <span class="host">${hostOf(l.url)}</span>
  </a>`).join("");
</script>
</body>
</html>
